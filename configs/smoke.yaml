# Tiny end-to-end run on temporary data: generate small train/val/test sets,
# then train for a few epochs. Used by scripts/smoke_test.sh.
#
# Everything not set here comes from the authors' conf/config.yaml
# (third_party/NN-Steiner/conf/config.yaml): m=15, kb=4, lr=1e-4, portal_weight=15, ...
defaults:
  - config
  - _self_

flow:
  - train

# Generated by scripts/smoke_test.sh. Folder names are
# batch<num_trees>_<x>x<y>-<dist>-<batch>-tensor (the seed isn't in the name,
# so the three sets differ in size to avoid overwriting each other).
train:
  train_set: data/batch4_100x100-uniform-80-tensor
  val_set: data/batch2_100x100-uniform-20-tensor
  test_set: data/batch1_100x100-uniform-10-tensor
  epochs: 4
  eval: 2
  max_no_update: 5
  batch_size: 20
  val_batch_size: 10
  test_batch_size: 10

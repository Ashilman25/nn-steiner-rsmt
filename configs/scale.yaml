# Data-scaling study: same model and settings, different amounts of training data.
# train_set and epochs change per run, so they go on the command line.

defaults:
  - config
  - _self_

flow:
  - train

train:
  val_set: data/batch4_100x100-uniform-128-tensor
  test_set: data/batch2_100x100-uniform-64-tensor
  batch_size: 50        # must equal samples per tree shape
  val_batch_size: 32
  test_batch_size: 32
  eval: 2               # check validation every 2 epochs
  max_no_update: 5      # stop after 5 checks (10 epochs) with no new best

nn_exp:
  test_set: upstream/points/point100_10000x10000-uniform-100-pt/
